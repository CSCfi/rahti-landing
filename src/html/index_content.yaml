# This yaml file is used to store the content of the index page

SITE_TITLE: Rahti

CLUSTERS:
  - NAME: Rahti
    ENV_VERSION: "OKD 4.22 / Kubernetes 1.35"
    SERVICE_DOCS_URL: "https://docs.csc.fi/cloud/rahti/"
    LOGIN_URL_OIDCIDP: "https://console.rahti.csc.fi/"

# LANDING_PAGE_ANNOUNCEMENTS is a list.
# Example for landing page announcement:
# LANDING_PAGE_ANNOUNCEMENTS:
#   - <p>this is a <a href="example.com">link</a></p>
#   - <p>yet another announcement!</p>
LANDING_PAGE_ANNOUNCEMENTS:
  - Deploy a Continuous Deployment solution with FluxCD<a href="https://docs.csc.fi/cloud/rahti/managed-software/fluxcd/"><i>Read more about FluxCD</i></a>
  - LoadBalancer service type is available on Rahti! <a href="https://docs.csc.fi/cloud/rahti/configurations/loadbalancer-service/"><i>Read more about LoadBalancer</i></a>

# HEADER_BANNER is string.
# In case you want to set a temporary banner in the header
# HEADER_BANNER: "Maintenance!"
HEADER_BANNER:
